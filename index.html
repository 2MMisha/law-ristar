<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=/he/">
<title>Rising Star — Legal</title>
<script>
  (function () {
    var lang = (navigator.language || navigator.userLanguage || "he").toLowerCase();
    var target = "/he/";
    if (lang.indexOf("ru") === 0) {
      target = "/ru/";
    } else if (lang.indexOf("en") === 0) {
      target = "/en/";
    } else if (lang.indexOf("he") === 0 || lang.indexOf("iw") === 0) {
      target = "/he/";
    }
    window.location.replace(target);
  })();
</script>
</head>
<body>
  <p>
    <a href="/he/">עברית</a> ·
    <a href="/en/">English</a> ·
    <a href="/ru/">Русский</a>
  </p>
</body>
</html>
